          </marker>
          <marker id="figureS2_method_overview-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#b33b1e"/>
          </marker>
        </defs>

        <rect width="640" height="480" fill="#f7f7f5"/>

