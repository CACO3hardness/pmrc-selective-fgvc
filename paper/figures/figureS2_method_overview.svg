        <rect x="406" y="94" width="28" height="12" rx="2" fill="#f7f7f5"/><text x="420" y="104" fill="#5f6368" font-size="8" font-family="Consolas, 'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">DATA</text>
        <rect x="326" y="184" width="48" height="12" rx="2" fill="#f7f7f5"/><text x="350" y="194" fill="#5f6368" font-size="8" font-family="Consolas, 'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">LOGITS</text>
