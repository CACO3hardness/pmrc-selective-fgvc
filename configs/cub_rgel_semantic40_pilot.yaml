dataset: cub200
root: data/CUB_200_2011_256
manifest: data/manifests/cub_seed0.json
noise_csv: data/noise/cub_semantic_40_seed0.csv
output_dir: runs
run_name: rgel_resnet50_cub_semantic40_seed0_v5

model: resnet50
pretrained: true
freeze_stages: 0
image_size: 224
batch_size: 16
num_workers: 0
epochs: 10
lr: 0.0001
weight_decay: 0.0001
grad_clip: 1.0
amp: true
amp_dtype: bf16
seed: 0
resume: true

vacuity_weight: 0.02
consistency_weight: 0.1
gate_warmup_epochs: 3
prototype_momentum: 0.9
prototype_threshold: 0.65
reliability_agreement_weight: 0.5
reliability_prototype_weight: 0.35
reliability_confidence_weight: 0.15
